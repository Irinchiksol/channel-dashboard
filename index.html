  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }

  .bar-row em { font-style: normal; text-align: right; font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

}
document.getElementById("app").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-key]");
  if (!button) return;
  state[button.dataset.key] = button.dataset.value;
  if (button.dataset.key === "period" && !activeReleases().some((r) => r.id === state.release)) state.release = "all";
  if (button.dataset.key === "sectionId") {
    const list = kids(state.sectionId);
    if (state.functionId !== "section" && !list.some((s) => s.id === state.functionId)) state.functionId = "section";
  }
  if (button.dataset.key === "functionId" && state.functionId !== "section") {
    const chosen = byId(SCENARIOS, state.functionId);
    if (chosen) state.sectionId = chosen.sectionId;
  }
  build();
});
build();
</script>
