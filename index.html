<style>
  :root {
    --bg: #f4f5f7;

    --line: #e3e6eb;
    --accent: #1d4e89;
    --accent-soft: #e8f0f8;
    --warn: #8a5a12;
    --warn-bg: #fbf6ee;
    --info-bg: #f3f6fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 24px; font-weight: 650; margin: 0 0 8px; }
  h2 { font-size: 18px; font-weight: 650; margin: 0; }
  h3 { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
  p { margin: 0; }
  .lead { color: var(--muted); max-width: 720px; }
  .label { font-size: 12px; font-weight: 650; margin: 18px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button.pill {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .scope { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .scope p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .note { border: 1px solid var(--line); background: var(--info-bg); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
  .note.warn { background: var(--warn-bg); }
  .note strong { display: block; margin-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 20px; font-weight: 650; }
  .kpi span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .kpi.warn b { color: var(--warn); }
  .block { margin-top: 22px; }
  .caption { color: var(--faint); font-size: 12px; margin-top: 8px; }
  .bar-row { display: grid; grid-template-columns: 168px 1fr 72px; gap: 8px; align-items: center; margin: 6px 0; }
  .bar-row span:first-child { font-size: 13px; }
  .track { height: 8px; background: #e8ebf0; border-radius: 99px; }
  .fill { height: 8px; background: var(--accent); border-radius: 99px; }
  .bar-row em { font-style: normal; text-align: right; font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 650; background: #fafbfc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.mark td { background: var(--accent-soft); }
  svg.line { width: 100%; height: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  @media (max-width: 800px) {
    .kpis { grid-template-columns: 1fr 1fr; }
    .bar-row { grid-template-columns: 110px 1fr 64px; }
  }
</style>

function line(title, caption, categories, series) {
  const w = 680, h = 220, left = 44, right = 12, top = 16, bottom = 28;
  const all = series.flatMap((s) => s.data);
  let min = Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const x = (i) => left + (i * (w - left - right)) / (categories.length - 1);
  const y = (v) => top + (1 - (v - min) / span) * (h - top - bottom);
  const colors = ["#1d4e89", "#8a93a0"];
  const paths = series.map((s, si) => `<polyline fill="none" stroke="${colors[si]}" stroke-width="2" points="${s.data.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" />`).join("");
  const labels = categories.map((c, i) => `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#5e6772">${c}</text>`).join("");
  const legend = `<div class="legend">${series.map((s, i) => `<span><i class="swatch" style="background:${colors[i]}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  return `<section class="block"><h3>${esc(title)}</h3>${legend}<svg class="line" viewBox="0 0 ${w} ${h}">${paths}${labels}</svg><p class="caption">${esc(caption)}</p></section>`;
}

    const i = PRODUCTS.indexOf(product);
    addStats([[mlnRub(product.incomeMln), "Доход продукта"], [rub((product.incomeMln * 1e6) / holders(i)), "На держателя"], [pct(product.incomeMln / c.incomeMln), "Доля дохода канала"], [mlnRub(c.incomeMln), "Сумма продуктов"]]);
    charts.push(bars("Доход продуктов", cap, PRODUCTS.map((p) => ({ label: p.name, value: p.incomeMln, text: mlnRub(p.incomeMln) }))));
  } else if (state.indicator === "value" && (state.level === "channel" || state.level === "segment")) {
    const subject = state.level === "segment" ? segment : null;
    addStats(subject ? [[rub(perAkb(subject)), "Доход на 1 АКБ"], [num(perAkb(subject) / c.incomePerAkb, 2), "Индекс к каналу"], [num(productsPer(subject), 2), "Продуктов"], [num(subject.opsPerAkb, 0), "Операций"]] : [[rub(c.incomePerAkb), "Доход на 1 АКБ"], [num(c.productsPerAkb, 2), "Продуктов на 1 АКБ"], [num(c.opsPerAkb, 1), "Операций на 1 АКБ"], [rub(c.turnoverPerAkb), "Оборот на 1 АКБ"]]);
    charts.push(bars("Доход на 1 АКБ", "Линия сравнения — канал, " + rub(c.incomePerAkb) + ". " + cap, life().map((s) => ({ label: s.short, value: perAkb(s), text: rub(perAkb(s)) }))));
  } else if (state.indicator === "value" && (state.level === "section" || state.level === "function")) {
    const weights = state.level === "section" ? sectionWeights(section.id) : fn.byLife;
    const value = audience(weights);
    const peers = state.level === "section" ? SECTIONS.map((s) => ({ label: s.name, value: audience(sectionWeights(s.id)).incomePer })) : SCENARIOS.map((f) => ({ label: f.short, value: audience(f.byLife).incomePer }));
    addStats([[rub(value.incomePer), "Оценка дохода на активного"], [num(value.incomePer / c.incomePerAkb, 2), "Индекс к каналу"], [num(value.productsPer, 2), "Оценка продуктов"], [num(value.opsPer, 1), "Оценка операций"]]);
    notes.push(["info", "Ценность аудитории", "Оценка собрана из дохода сегментов, которые составляют аудиторию. Прямой результат сценария остаётся в «Доходности»."]);
    charts.push(bars("Оценка дохода аудитории", cap, peers.map((p) => ({ ...p, text: rub(p.value) }))));
  } else if (state.indicator === "value" && state.level === "product") {
    const i = PRODUCTS.indexOf(product);
    const per = (product.incomeMln * 1e6) / holders(i);
    addStats([[rub(per), "Доход на держателя"], [num(per / c.incomePerAkb, 2), "К доходу на АКБ"], [String(product.opsPerHolder), "Операций на держателя"], [pct(holders(i) / c.akb), "Проникновение"]]);
    charts.push(bars("Доход на держателя", cap, PRODUCTS.map((p, idx) => ({ label: p.name, value: (p.incomeMln * 1e6) / holders(idx), text: rub((p.incomeMln * 1e6) / holders(idx)) }))));
  } else if (state.indicator === "dynamics" && state.level === "channel") {
    const mau = [...HIST.mau, Math.round(c.mau / 1e4) / 100];
    const akb = [...HIST.akb, Math.round(c.akb / 1e4) / 100];
    const income = [...HIST.income, c.incomeMln];
    const dau = [...HIST.dau, Math.round(c.dau / 1e4) / 100];
    addStats([[delta(mau[5], mau[4]), "MAU к августу"], [delta(akb[5], akb[4]), "АКБ к августу"], [delta(income[5], income[4]), "Доход к августу"], [pct(dau[5] / mau[5]), "DAU/MAU в сентябре"]]);
    charts.push(line("MAU и АКБ, млн клиентов", "Апрель–сентябрь 2026. " + cap, MONTHS, [{ name: "MAU", data: mau }, { name: "АКБ", data: akb }]));
    charts.push(line("Клиентский доход, млн ₽", "Апрель–сентябрь 2026. " + cap, MONTHS, [{ name: "Доход", data: income }]));
  } else if (state.indicator === "dynamics" && state.level === "segment") {
    const series = segment.trend.map((t) => segment.mau / 1e6 * t);
    const base = series[0];
    const own = series.map((v) => Math.round(v / base * 1000) / 10);
    const chMau = [...HIST.mau, c.mau / 1e6];
    const chIdx = chMau.map((v) => Math.round(v / chMau[0] * 1000) / 10);
    const aug = segment.mau * segment.trend[4];
    const left = aug * segment.churn;
    const stayed = aug - left;
    const arrived = segment.mau - stayed;
    notes.push(["info", "Удержание и отток", "D7, D30 и M3 — доля когорты, активной на 7-й день, на 30-й день и в третьем месяце. Отток — доля MAU августа вне сентября. Пришедшие клиенты могут перекрыть отток, и MAU при этом растёт."]);
    addStats([[pct(segment.d7), "Retention D7"], [pct(segment.d30), "Retention D30"], [pct(segment.m3), "Retention M3"], [pct(segment.churn), "Отток MAU к августу"]]);
    charts.push(bars("Удержание, % когорты", cap, [{ label: "D7", value: segment.d7, text: pct(segment.d7) }, { label: "D30", value: segment.d30, text: pct(segment.d30) }, { label: "M3", value: segment.m3, text: pct(segment.m3) }]));
    charts.push(bars("Отток MAU", cap, life().map((s) => ({ label: s.short, value: s.churn, text: pct(s.churn) }))));
    charts.push(line("Индекс к апрелю, апрель = 100", "Апрель–сентябрь 2026. " + cap, MONTHS, [{ name: segment.short, data: own }, { name: "Канал", data: chIdx }]));
    tables.push(table("Мост MAU, август → сентябрь", "Сентябрь = остались + пришли. " + cap, ["Шаг", "Клиенты"], [["MAU августа", people(aug)], ["Ушли", people(left)], ["Остались", people(stayed)], ["Пришли", people(arrived)], ["MAU сентября", people(segment.mau)]]));
  } else if (state.indicator === "dynamics") {
    let series, name;
    if (state.level === "section") { series = section.trend.map((t) => section.mau / 1e6 * t); name = section.name; }
    else if (state.level === "function") { series = fn.trend.map((t) => scenarioMau(fn) / 1e6 * t); name = fn.short; }
    else { series = product.trend.map((t) => holders(PRODUCTS.indexOf(product)) / 1e6 * t); name = product.name; }
    const base = series[0];
    const own = series.map((v) => Math.round(v / base * 1000) / 10);
    const chMau = [...HIST.mau, c.mau / 1e6];
    const chIdx = chMau.map((v) => Math.round(v / chMau[0] * 1000) / 10);
    addStats([[delta(series[5], series[4]), "К августу"], [num(own[5], 1), "Индекс к апрелю"], [num(chIdx[5], 1), "Индекс канала к апрелю"], [name, "Срез"]]);
    charts.push(line("Индекс к апрелю, апрель = 100", "Апрель–сентябрь 2026. " + cap, MONTHS, [{ name: name, data: own }, { name: "Канал", data: chIdx }]));
  }

  const scope = state.level === "channel" ? "Весь цифровой канал" : state.level === "segment" ? segment.name + (segment.slice ? " · срез" : "") : state.level === "section" ? section.name : state.level === "function" ? byId(SECTIONS, fn.sectionId).name + " → " + fn.name : product.name;
  const entity = state.level === "segment" ? pills(SEGMENTS.map((s) => [s.id, s.slice ? s.short + " · срез" : s.short]), "segmentId", state.segmentId) : state.level === "section" ? pills(SECTIONS.map((s) => [s.id, s.name]), "sectionId", state.sectionId) : state.level === "function" ? pills(SCENARIOS.map((s) => [s.id, s.short]), "functionId", state.functionId) : state.level === "product" ? pills(PRODUCTS.map((s) => [s.id, s.name]), "productId", state.productId) : "";
  const title = INDICATORS.find((x) => x[0] === state.indicator)[1];
  document.getElementById("app").innerHTML = `
    <h1>Дэшборд цифрового канала</h1>
    <p class="lead">Одна витрина. Верхний ряд задаёт уровень анализа, нижний — тип показателя. Сентябрь 2026, цифры иллюстративные и сведены между собой.</p>
    <p class="label">Уровень анализа</p>
    ${pills(LEVELS, "level", state.level)}
    ${entity}
    <p class="label">Тип показателя</p>
    ${pills(INDICATORS, "indicator", state.indicator)}
    <div class="scope"><h2>${esc(title)}</h2><p>${esc(scope)} · сентябрь 2026</p></div>
    ${notes.map((n) => `<div class="note${n[0] === "warn" ? " warn" : ""}"><strong>${esc(n[1])}</strong><p>${esc(n[2])}</p></div>`).join("")}
    <div class="kpis">${stats.map((s) => `<div class="kpi${s[2] ? " warn" : ""}"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>
    ${charts.join("")}
    ${tables.join("")}
  `;
}
document.getElementById("app").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-key]");
  if (!button) return;
  state[button.dataset.key] = button.dataset.value;
  build();
});
build();
</script>
</body>
</html>
